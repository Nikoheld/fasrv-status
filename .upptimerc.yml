skipDeleteIssues: true
secrets: []

status-website:
  cname: status.fasrv.ch
  theme: dark
  name: FASRV Status
  introTitle: "**FASRV** service status"
  introMessage: Live availability, response times, and incident history for FASRV services.
  customBodyHtml: '<div id="fasrv-report-root"></div>'
  scripts:
    - src: https://status.fasrv.ch/report-form.js
      defer: true
  links:
    - rel: stylesheet
      href: https://status.fasrv.ch/report-form.css
  navbar:
    - title: Status
      href: /
    - title: FASRV
      href: https://fasrv.ch
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

workflowSchedule:
  uptime: "*/5 * * * *"
